<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeuroNexus Internship Form</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>NeuroNexus Internship Form</h2>
        <form id="internshipForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Contact Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="address">Address</label>
            <textarea id="address" name="address" required></textarea>

            <label for="company">Company Name</label>
            <input type="text" id="company" name="company" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">-- Select --</option>
                <option value="HR">HR</option>
                <option value="Sales">Sales</option>
                <option value="Development">Development</option>
                <option value="Marketing">Marketing</option>
                <option value="Others">Others</option>
            </select>

            <label>Gender</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
        <div id="successMessage" class="success-message" style="display:none;">Applied Successfully</div>
        <button id="resetBtn" class="reset-btn" style="display:none;">Reset Form</button>
    </div>

    <script>
        const form = document.getElementById('internshipForm');
        const successMessage = document.getElementById('successMessage');
        const resetBtn = document.getElementById('resetBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Show success message and reset button
            successMessage.style.display = 'block';
            resetBtn.style.display = 'block';

            // Optionally disable the submit button to prevent multiple submissions
            form.querySelector('.submit-btn').disabled = true;
        });

        resetBtn.addEventListener('click', function() {
            // Hide success message and reset button
            successMessage.style.display = 'none';
            resetBtn.style.display = 'none';

            // Reset the form fields
            form.reset();

            // Enable the submit button again
            form.querySelector('.submit-btn').disabled = false;
        });
    </script>
</body>

</html>
